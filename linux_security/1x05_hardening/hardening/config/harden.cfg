# Utils variables
LOG_PATH="/var/log/hardening.log"
BEAN="/dev/null"
REPORT_FILE="./audit_report.txt"

# Network variables
SSH_PORT=22
HTTP_PORT=80
HTTPS_PORT=443
HARDENING_DIRECTORY="/etc/hardening/"
FIREWALL_RULES_FILE="/etc/hardening/firewall.rules"
SYSCTL_CONF="/etc/sysctl.conf"

# SSH variables
SSH_CFG="/etc/ssh/sshd_config"

# Identity variables
PASS_MIN_LEN=12
PASS_MAX_DAYS=90
USER_DEFS_CFG="/etc/login.defs"
PAM_PASS_CFG="/etc/pam.d/common-password"
FAIL_LOCK_ATTEMPS=5
PWQ_FILE="/etc/security/pwquality.conf"
AUTH_FILE="/etc/pam.d/common-auth"
ACCOUNT_FILE="/etc/pam.d/common-account"
PASSWD_FILE="/etc/passwd"
GROUPS_NOLOCK="sudo|wheel"

