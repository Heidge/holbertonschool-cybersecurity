#Path of log file
LOG_PATH="/var/log/hardening.log"

#Ports informations
SSH_PORT=22
HTTP_PORT=80
HTTPS_PORT=443

#Firewall rules path
FIREWALL_RULES_FILE="/etc/hardening/firewall.rules"

#SSH config path
SSH_CFG=/etc/ssh/sshd_config

#Identity rules
PASS_MIN_LEN=12
PASS_MAX_DAYS=90
FAIL_LOCK_ATTEMPS=5

PWQ_FILE="/etc/security/pwquality.conf" 
